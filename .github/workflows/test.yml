name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # opencv-python libGL ister; edge testleri onsuz atlanırdı
      - run: sudo apt-get update && sudo apt-get install -y libgl1

      - run: pip install -e ".[dev,edge]"

      # -rs: atlanan testler gerekçesiyle özette görünsün
      - run: pytest -q -rs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pyproject'te `select` tanımlı olmadığından etkin kurallar ruff sürümüne bağlı;
      # sürüm sabitlenmezse yeni bir ruff sürümü CI'ı kendiliğinden kırabilir
      - run: pip install -e ".[dev,edge]" "ruff==0.17.3"

      - run: ruff check .

      - run: mypy evren_sdk
